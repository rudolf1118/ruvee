# /etc/postgresql/18/main/conf.d/50-ruvee.conf. Guide: docs/guides/private-rehearsal.md.
# The durability settings are PostgreSQL's defaults; they are stated so that a changed default or
# an inherited tuning file cannot turn them off unnoticed. The rehearsal checks them with SHOW.

listen_addresses = 'localhost'
fsync = on
synchronous_commit = on
full_page_writes = on
password_encryption = 'scram-sha-256'

# Enough for the API's pool (10), ruvee-admin, a restore and an operator session.
max_connections = 50

log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
log_lock_waits = on
